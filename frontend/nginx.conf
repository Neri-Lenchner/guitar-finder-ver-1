server {
    listen 8080;

    root /usr/share/nginx/html;
    index index.html;

    # Proxy API and uploads to backend via Railway private network
    location /api/ {
        proxy_pass http://guitar-finder-ver-1.railway.internal:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /uploads/ {
        proxy_pass http://guitar-finder-ver-1.railway.internal:8080/uploads/;
        proxy_set_header Host $host;
    }

    # SPA fallback — all routes serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
