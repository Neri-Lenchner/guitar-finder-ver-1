server {
    listen 8080;

    root /usr/share/nginx/html;
    index index.html;

    # Proxy API and uploads to backend via public URL
    location /api/ {
        proxy_pass https://guitar-finder-ver-1-production-396a.up.railway.app/api/;
        proxy_ssl_server_name on;
        proxy_set_header Host guitar-finder-ver-1-production-396a.up.railway.app;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /uploads/ {
        proxy_pass https://guitar-finder-ver-1-production-396a.up.railway.app/uploads/;
        proxy_ssl_server_name on;
        proxy_set_header Host guitar-finder-ver-1-production-396a.up.railway.app;
    }

    # SPA fallback — all routes serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
